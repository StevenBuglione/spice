name: Bug
about: Reproducible Spice defect
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest Go source and exact commands.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include full diagnostics or output.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Spice version, Go version, operating system, and architecture.
    validations:
      required: true
