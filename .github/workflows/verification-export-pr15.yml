name: Verification Export PR 15

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export-exact-parent:
    if: github.head_ref == 'verification/pr-15-export-1a392b9'
    runs-on: ubuntu-latest
    steps:
      - name: Check out temporary verification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Confirm exact implementation parent
        run: test "$(git rev-parse HEAD^)" = "1a392b999c90ce7dbb57d176283e433887287a88"
      - name: Archive exact implementation head
        run: git archive --format=tar.gz --output=spice-pr15-exact-head.tar.gz HEAD^
      - name: Upload exact implementation tree
        uses: actions/upload-artifact@v4
        with:
          name: spice-pr15-exact-head
          path: spice-pr15-exact-head.tar.gz
          retention-days: 1
          if-no-files-found: error
