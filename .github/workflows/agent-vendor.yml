name: Agent Vendor Bootstrap

on:
  push:
    branches: [agent/issue-8-type-aware-loader]

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/issue-8-type-aware-loader
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Generate pinned vendor tree
        run: |
          go get golang.org/x/tools/go/packages@v0.36.0
          go mod tidy
          go mod vendor
      - name: Commit generated dependencies
        run: |
          git config user.name "spice-agent"
          git config user.email "spice-agent@users.noreply.github.com"
          git add go.mod go.sum vendor
          if git diff --cached --quiet; then
            echo "Vendored dependency tree is already current."
          else
            git commit -m "deps: vendor go/packages v0.36.0"
            git push origin HEAD:agent/issue-8-type-aware-loader
          fi
