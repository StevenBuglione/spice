name: Agent verified patch applicator

on:
  push:
    branches:
      - agent/issue-8-type-aware-loading

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/issue-8-type-aware-loading
          fetch-depth: 0
      - name: Apply locally verified patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/spice.patch.gz.b64 <<'PATCH'
          
          PATCH
          base64 --decode /tmp/spice.patch.gz.b64 | gzip --decompress > /tmp/spice.patch
          git apply --check /tmp/spice.patch
          git apply /tmp/spice.patch
          rm -f .github/workflows/agent-workspace-export.yml
          git diff --check
          git config user.name "Spice Primary Implementer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: make stable symbol identities collision-free"
          git push origin HEAD:agent/issue-8-type-aware-loading
