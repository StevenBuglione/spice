name: Agent Source Bootstrap

on:
  push:
    branches: [agent/issue-8-type-aware-loader]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Prepare pinned vendored workspace
        run: |
          go get golang.org/x/tools/go/packages@v0.36.0
          go mod tidy
          go mod vendor
          tar --exclude=.git -czf /tmp/spice-source.tgz .
      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: spice-source
          path: /tmp/spice-source.tgz
          retention-days: 1
