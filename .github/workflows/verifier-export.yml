name: Verifier Export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Fetch and archive exact reviewed head
        shell: bash
        run: |
          set -euo pipefail
          reviewed_sha="82bbe4cb1607aedaf4d3ff6bcecc820e6fc5bc07"
          git fetch --no-tags --depth=1 origin "$reviewed_sha"
          test "$(git rev-parse FETCH_HEAD)" = "$reviewed_sha"
          git archive --format=tar.gz --output=spice-reviewed-head.tar.gz "$reviewed_sha"
          printf '%s\n' "$reviewed_sha" > reviewed-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: spice-reviewed-head-82bbe4
          path: |
            spice-reviewed-head.tar.gz
            reviewed-head.txt
          if-no-files-found: error
          retention-days: 1
