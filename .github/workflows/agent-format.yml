name: Agent Format Bootstrap

on:
  push:
    branches: [agent/issue-8-type-aware-loader]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/issue-8-type-aware-loader
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Format implementation
        run: gofmt -w compiler/load/load.go compiler/load/load_test.go
      - name: Commit formatting
        run: |
          git config user.name "spice-agent"
          git config user.email "spice-agent@users.noreply.github.com"
          git add compiler/load/load.go compiler/load/load_test.go
          if git diff --cached --quiet; then
            echo "Formatting is already current."
          else
            git commit -m "style: format typed loader implementation"
            git push origin HEAD:agent/issue-8-type-aware-loader
          fi
