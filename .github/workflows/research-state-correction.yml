name: Correct research delivery-state snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  correct:
    if: github.event.pull_request.head.ref == 'research/application-module-model-state-correction'
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: research/application-module-model-state-correction
      - name: Correct mutable delivery-state wording and remove this workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('research/go-native-application-module-model.md')
          text = path.read_text()
          old = '''- issue #8 / PR #15 is the single active delivery lane for typed package loading and stable symbols;
          - the current PR head is `1639d55b37a4b7706fb347bc3d37ae60cd7e7137` and is in `CHANGES_REQUESTED` because blank-identifier type, function, and method declarations can still collide in the stable symbol catalog;
          '''
          new = '''- issue #8 / PR #15 is the single active delivery lane for typed package loading and stable symbols and is being recovered from verifier-requested stable-symbol identity gaps;
          - this research does not pin or modify that mutable implementation branch; actual GitHub branch, lease, state-comment, and CI state remain authoritative;
          '''
          if old not in text:
              raise SystemExit('expected delivery-state text not found')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/research-state-correction.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/go-native-application-module-model.md .github/workflows/research-state-correction.yml
          git commit -m 'docs: avoid pinning mutable implementation state'
          git push origin HEAD:research/application-module-model-state-correction
