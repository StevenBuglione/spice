name: Apply issue 8 stable identity fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/issue-8-type-aware-loading'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-8-type-aware-loading
          fetch-depth: 0
      - name: Apply, verify, and push the stable identity fix
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'TestLoadOmitsNonAddressableDeclarationsAndReturnsUniqueSymbolIDs' compiler/load/load_contract_test.go; then
            echo 'Stable identity fix already applied; no write required.'
            exit 0
          fi
          cat > /tmp/issue8.patch.b64 <<'PATCH'
          
          PATCH
          base64 -d /tmp/issue8.patch.b64 > /tmp/issue8.patch
          git apply --index /tmp/issue8.patch
          gofmt -w compiler/load/load.go compiler/load/load_test.go compiler/load/load_contract_test.go
          make verify
          go test ./compiler/load -run '^TestLoadMultiPackageProgram$' -v
          go test ./compiler/load -run '^TestLoadBuildConstraints$' -v
          go test ./compiler/load -run '^TestLoadTypeErrors$' -v
          go test ./compiler/load -run '^TestLoadRejectsTestVariantMode$' -v
          go test ./compiler/load -run '^TestLoad(HonorsEnvironment|ReturnsStableSymbolOrder|ReturnsStableDiagnosticOrder)$' -v
          go test ./compiler/load -run '^TestLoadOmitsNonAddressableDeclarationsAndReturnsUniqueSymbolIDs$' -v
          GOPROXY=off go test -mod=vendor ./...
          go test ./compiler/load -run '^TestLoadDeterministic$' -count=10
          GOPROXY=off go test -mod=vendor -race ./...
          GOPROXY=off go list -mod=vendor ./...
          GOPROXY=off go vet -mod=vendor ./...
          git config user.name 'Spice Primary Implementer'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix: preserve unique loader symbol identities'
          git push origin HEAD:agent/issue-8-type-aware-loading
