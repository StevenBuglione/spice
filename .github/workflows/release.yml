name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go 1.26.5
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
            examples/commerce/go.sum
            examples/petclinic/go.sum
      - name: Verify release candidate
        run: make verify-release
      - name: Require signing key
        env:
          SPICE_RELEASE_SIGNING_KEY: ${{ secrets.SPICE_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$SPICE_RELEASE_SIGNING_KEY"
          umask 077
          printf '%s' "$SPICE_RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/spice-release.key"
      - name: Build signed reproducible artifacts
        run: |
          epoch="$(git show -s --format=%ct HEAD)"
          go run ./cmd/spice-release \
            -version="$GITHUB_REF_NAME" \
            -source-date-epoch="$epoch" \
            -signing-key="$RUNNER_TEMP/spice-release.key" \
            -output=dist
      - name: Publish immutable-tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --generate-notes
          --fail-on-no-commits
