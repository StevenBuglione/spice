name: Issue 8 provenance patch

on:
  push:
    branches:
      - agent/issue-8-type-aware-loading

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply issue 8 provenance patch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-8-type-aware-loading
          fetch-depth: 2
      - name: Verify expected parent
        run: test "$(git rev-parse HEAD^)" = "82bbe4cb1607aedaf4d3ff6bcecc820e6fc5bc07"
      - name: Apply tested patch
        shell: bash
        run: |
          cat > /tmp/issue8.patch.gz.b64 <<'PATCH'
          
          PATCH
          base64 --decode /tmp/issue8.patch.gz.b64 | gzip -dc > /tmp/issue8.patch
          git apply --check /tmp/issue8.patch
          git apply /tmp/issue8.patch
          rm .github/workflows/issue8-apply-provenance.yml
          git diff --check
      - name: Verify implementation
        run: make verify
      - name: Commit tested patch
        run: |
          git config user.name "spice-agent"
          git config user.email "spice-agent@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve Go source provenance contracts"
          git push origin HEAD:agent/issue-8-type-aware-loading
