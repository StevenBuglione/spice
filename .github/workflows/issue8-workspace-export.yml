name: Issue 8 workspace export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/issue-8-type-aware-loading'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-8-type-aware-loading
      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: issue8-workspace-${{ github.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1
