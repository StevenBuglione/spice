{{define "layout/header"}}
<!doctype html>
<html lang="{{.Locale}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{msg .Locale "layoutTitle"}}</title>
  <link rel="icon" href="/resources/leaf.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/resources/petclinic.css">
</head>
<body>
  <nav class="navbar" aria-label="Primary">
    <div class="nav-inner">
      <a class="brand" href="/"><img class="brand-mark" src="/resources/leaf.svg" alt="">PetClinic</a>
      <div class="nav-links">
        <a href="/" {{if eq .Active "home"}}aria-current="page"{{end}}>{{msg .Locale "home"}}</a>
        <a href="/owners/find" {{if eq .Active "owners"}}aria-current="page"{{end}}>{{msg .Locale "findOwners"}}</a>
        <a href="/vets.html" {{if eq .Active "vets"}}aria-current="page"{{end}}>{{msg .Locale "vets"}}</a>
      </div>
      <span class="language">{{.Locale}}</span>
    </div>
  </nav>
  <main class="container">
{{end}}

{{define "layout/footer"}}
  </main>
  <footer>PetClinic · Spring behavior, Go-native implementation · <a href="/actuator/health">Health</a></footer>
</body>
</html>
{{end}}
