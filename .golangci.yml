version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly
  allow-serial-runners: true

linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - cyclop
    - depguard
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - forcetypeassert
    - gocheckcompilerdirectives
    - gocritic
    - godoclint
    - gomoddirectives
    - govet
    - ineffassign
    - interfacebloat
    - maintidx
    - modernize
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - predeclared
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
  settings:
    cyclop:
      max-complexity: 15
      package-average: 10
    depguard:
      rules:
        public-api:
          list-mode: lax
          files:
            - "annotation/**/*.go"
            - "async/**/*.go"
            - "batch/**/*.go"
            - "bean/**/*.go"
            - "cache/**/*.go"
            - "config/**/*.go"
            - "conversion/**/*.go"
            - "data/**/*.go"
            - "event/**/*.go"
            - "expression/**/*.go"
            - "httpclient/**/*.go"
            - "i18n/**/*.go"
            - "intercept/**/*.go"
            - "lifecycle/**/*.go"
            - "mail/**/*.go"
            - "management/**/*.go"
            - "messaging/**/*.go"
            - "migration/**/*.go"
            - "observability/**/*.go"
            - "resource/**/*.go"
            - "retry/**/*.go"
            - "schedule/**/*.go"
            - "security/**/*.go"
            - "session/**/*.go"
            - "spicetest/**/*.go"
            - "validation/**/*.go"
            - "view/**/*.go"
            - "web/**/*.go"
          deny:
            - pkg: "github.com/spice-framework/toolchain"
              desc: "public API packages must not depend on the standalone toolchain"
            - pkg: "github.com/spice-framework/spice/internal"
              desc: "public API packages must not depend on internal implementation packages"
            - pkg: "github.com/spice-framework/spice/starter"
              desc: "core runtime packages must not depend on opt-in starters"
        starters:
          list-mode: lax
          files:
            - "starter/**/*.go"
          deny:
            - pkg: "github.com/spice-framework/toolchain"
              desc: "runtime starters must not depend on the standalone toolchain"
            - pkg: "github.com/spice-framework/spice/internal"
              desc: "public starters must not depend on repository internals"
            - pkg: "github.com/spice-framework/spice/examples"
              desc: "public starters must not depend on example applications"
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - "(io.Closer).Close"
    exhaustive:
      default-signifies-exhaustive: false
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^fmt\.Print(f|ln)?$'
          msg: "write through an injected io.Writer or structured logger"
        - pattern: '^log\.Fatal(f|ln)?$'
          msg: "return an error to the entrypoint"
        - pattern: '^os\.Exit$'
          msg: "return an error and let an entrypoint select the exit code"
    govet:
      enable-all: true
      disable:
        - fieldalignment
    maintidx:
      under: 20
    nolintlint:
      allow-no-explanation:
        - funlen
      require-specific: true
      require-explanation: true
    revive:
      severity: warning
      rules:
        - name: comment-spacings
          arguments:
            - "@"
    sloglint:
      no-global: all
      context: scope
      static-msg: true
      key-naming-case: snake
    staticcheck:
      checks:
        - all

  exclusions:
    generated: strict
    warn-unused: true
    rules:
      - path: "_test\\.go$"
        linters:
          - cyclop
          - forbidigo
          - maintidx
          - noctx
      # The repository verifier alone translates its returned status to the OS.
      - path: "(^|.*[/\\\\])internal[/\\\\]qualitygate[/\\\\]main\\.go$"
        text: 'use of `os\.Exit`'
        linters:
          - forbidigo
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/spice-framework/spice

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true

output:
  sort-order:
    - file
    - linter
